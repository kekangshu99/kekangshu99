<svg width="600" height="180" viewBox="0 0 600 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B9D"/>
      <stop offset="50%" style="stop-color:#C44DFF"/>
      <stop offset="100%" style="stop-color:#00D4FF"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
  </defs>

  <!-- Outer gradient border -->
  <rect x="1" y="1" width="598" height="178" rx="10" ry="10"
        fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Background -->
  <rect x="3" y="3" width="594" height="174" rx="9" ry="9"
        fill="url(#bgGrad)"/>

  <!-- Name tag -->
  <rect x="16" y="-1" width="120" height="22" rx="4" ry="4"
        fill="url(#borderGrad)"/>
  <text x="76" y="14" font-family="'Courier New', monospace" font-size="12"
        fill="#0d1117" text-anchor="middle" font-weight="bold">kekangshu99</text>

  <!-- Dialogue text -->
  <text x="28" y="52" font-family="'Courier New', monospace" font-size="13" fill="#E6EDF3">
    Hey! I&apos;m a developer who builds worlds with
  </text>
  <text x="28" y="72" font-family="'Courier New', monospace" font-size="13" fill="#E6EDF3">
    C++ and Python — and summons AI power
  </text>
  <text x="28" y="92" font-family="'Courier New', monospace" font-size="13" fill="#FF6B9D">
    with Claude Code ✨
  </text>
  <text x="28" y="118" font-family="'Courier New', monospace" font-size="13" fill="#C44DFF">
    Fueled by anime, games, and caffeine ☕ 🎮
  </text>
  <text x="28" y="144" font-family="'Courier New', monospace" font-size="12" fill="#888">
    Current quest:
  </text>
  <text x="120" y="144" font-family="'Courier New', monospace" font-size="12" fill="#00D4FF">
    learning game engine architecture
  </text>

  <!-- Decorative label -->
  <text x="572" y="165" font-family="'Courier New', monospace" font-size="11"
        fill="#444" text-anchor="end">✦ ABOUT ME</text>
</svg>
